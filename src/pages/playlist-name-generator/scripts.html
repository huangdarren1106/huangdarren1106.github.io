            function getRandomElement(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            function generateAlbumName() {
                const adjective = getRandomElement(adjectives);
                const noun = getRandomElement(nouns);
                return `${adjective} ${noun}`;
            }

            function saveName(name) {
                let savedNames = JSON.parse(localStorage.getItem('savedNames')) || [];
                savedNames.push(name);
                localStorage.setItem('savedNames', JSON.stringify(savedNames));
                renderSavedNames();
            }

            function deleteName(index) {
                let savedNames = JSON.parse(localStorage.getItem('savedNames')) || [];
                const reversedIndex = savedNames.length - 1 - index;
                savedNames.splice(reversedIndex, 1);
                localStorage.setItem('savedNames', JSON.stringify(savedNames));
                renderSavedNames();
            }

            function clearAllNames() {
                localStorage.removeItem('savedNames');
                renderSavedNames();
            }

            function renderSavedNames() {
                const savedNames = JSON.parse(localStorage.getItem('savedNames')) || [];
                const savedNamesContainer = document.getElementById('savedNames');
                savedNamesContainer.innerHTML = savedNames.reverse().map((name, index) => `
      <div class="flex justify-between items-center bg-gray-200 px-4 py-2 my-2 rounded">
        <span>${name}</span>
        <span class="text-red-500 w-8 h-8 rounded-full flex justify-center items-center bg-red-50" onclick="deleteName(${index})">&times;</span>
      </div>
    `).join('');
            }

            document.getElementById('generateBtn').addEventListener('click', () => {
                const albumName = generateAlbumName();
                document.getElementById('albumName').value = albumName;
                saveName(albumName);
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                const albumNameInput = document.getElementById('albumName');
                albumNameInput.select();
                document.execCommand('copy');
            });

            // Initial render of saved names
            document.addEventListener('DOMContentLoaded', renderSavedNames);
        </script>
